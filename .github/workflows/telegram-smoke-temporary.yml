name: Temporary Telegram Smoke Test

on:
  push:
    branches:
      - main
    paths:
      - .github/telegram-smoke-trigger

permissions:
  contents: write

jobs:
  smoke:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Send Telegram smoke test
        id: smoke
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_SMOKE_TEST: true
        run: npm run notify

      - name: Persist smoke status
        if: ${{ always() && !cancelled() }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add status/telegram.json notifications/pending.json notifications/sent.json
          if git diff --cached --quiet; then
            echo "No Telegram smoke status changes to commit."
          else
            git commit -m "chore: record Telegram smoke test"
            git push
          fi
