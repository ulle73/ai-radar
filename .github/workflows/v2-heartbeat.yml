name: v2 Heartbeat (public)

# Kör detektorerna mot publika källor (releaser, YouTube, CI för publika repon) och skickar
# observationerna signerade till n8n (R2 – Observation Ingest). Privata källor körs lokalt.
# Repot är publikt: skriptet loggar bara antal och källstatus, aldrig innehåll.

on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: v2-heartbeat-public
  cancel-in-progress: false

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run tests
        run: npm test

      - name: Run public heartbeat
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          R2_SIGNING_SECRET: ${{ secrets.R2_SIGNING_SECRET }}
        run: node scripts/v2/heartbeat.mjs --mode public --runner actions
