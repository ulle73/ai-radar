name: Daily GitHub Radar

on:
  schedule:
    # 03:15 Swedish time during CEST (01:15 UTC).
    # 02:15 Swedish time during CET.
    - cron: "15 1 * * *"
  workflow_dispatch:
  push:
    branches:
      - chore/manual-radar-run
    paths:
      - .github/manual-radar-trigger

permissions:
  contents: write

concurrency:
  group: daily-github-radar
  cancel-in-progress: false

jobs:
  radar:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run tests
        run: npm test

      - name: Collect GitHub candidates
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RADAR_MAX_REPOS: 30
          RADAR_TRENDING_REPOS_PER_SOURCE: 10
          RADAR_TRENDING_DEVELOPERS_PER_SOURCE: 10
          RADAR_README_MAX_CHARS: 25000
          RADAR_SUMMARY_README_CHARS: 1600
          RADAR_NEW_DAYS: 7
          RADAR_PUSHED_DAYS: 7
          RADAR_MIN_STARS_NEW: 20
          RADAR_MIN_STARS_ACTIVE: 500
        run: npm run radar

      - name: Analyze, rank and create notification candidates
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL }}
          OPENROUTER_SITE_URL: https://github.com/ulle73/ai-radar
          OPENROUTER_APP_NAME: Jonas AI Radar
          ANALYSIS_BATCH_SIZE: 5
          NOTIFY_MIN_SCORE: 82
        run: npm run analyze

      - name: Commit radar outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data rankings state notifications status
          if git diff --cached --quiet; then
            echo "No radar changes to commit."
          else
            git commit -m "data: update ai radar $(date -u +'%Y-%m-%d')"
            git push
          fi
