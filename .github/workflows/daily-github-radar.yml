name: Daily GitHub Radar

on:
  schedule:
    # Runs every night at 03:15 Swedish time during CEST (01:15 UTC).
    # During winter/CET this is 02:15 Swedish time.
    - cron: "15 1 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-github-radar
  cancel-in-progress: false

jobs:
  radar:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run GitHub radar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RADAR_MAX_REPOS: 30
          RADAR_README_MAX_CHARS: 25000
          RADAR_SUMMARY_README_CHARS: 1600
          RADAR_NEW_DAYS: 7
          RADAR_PUSHED_DAYS: 7
          RADAR_MIN_STARS_NEW: 20
          RADAR_MIN_STARS_ACTIVE: 500
        run: npm run radar

      - name: Commit radar results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "No radar changes to commit."
          else
            git commit -m "data: update github radar $(date -u +'%Y-%m-%d')"
            git push
          fi
